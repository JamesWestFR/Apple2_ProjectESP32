; PlatformIO Project Configuration File — Apple2_ProjectESP32
;
; Émulateur Apple ][, ][+, //e et //e Enhanced pour ESP32 (LILYGO TTGO VGA32)
; Basé sur l'architecture ESPectrum (Víctor Iborra / Eremus)
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = psram

; La carte réelle : ESP32-PICO-D4 avec PSRAM (TTGO VGA32 v1.4)
[env:psram]
platform = espressif32@5.4
board = pico32
framework = espidf
monitor_speed = 115200
monitor_filters =
	direct
	esp32_exception_decoder
board_build.partitions = partitions.csv
build_flags =
	-w
	-O2
board_build.f_flash = 80000000L
build_type = release
